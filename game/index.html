<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SELVA OSCURA — Dite</title>
<link rel="stylesheet" href="style.css">
<script type="importmap">
{ "imports": { "three": "./vendor/three/three.module.min.js", "three/addons/": "./vendor/three/addons/" } }
</script>
</head>
<body>
<canvas id="game"></canvas>

<div id="hud">
  <div id="pbars">
    <div class="bar hp"><div id="hp-lag" class="lag"></div><div id="hp-fill" class="fill"></div></div>
    <div class="bar st"><div id="st-fill" class="fill"></div></div>
  </div>
  <div id="flasks"><span class="flask-ico"></span><span id="flask-n">3</span></div>
  <div id="bossbar">
    <div class="boss-head"><span id="boss-name">DITE</span><span id="boss-title"></span><span id="boss-dmg"></span></div>
    <div class="bar boss"><div id="boss-lag" class="lag"></div><div id="boss-fill" class="fill"></div></div>
  </div>
  <div id="reticle"></div>
</div>
<div id="vignette"></div>
<div id="flash"></div>

<div id="victory" class="screen"><div class="big gold">THE ABYSS FALLS SILENT</div><div class="sub">Dite is vanquished</div><div class="prompt">R · Enter — 다시 도전</div></div>
<div id="defeat" class="screen"><div class="big red">THE STRAIGHT WAY WAS LOST</div><div class="sub">you have fallen</div><div class="prompt">R · Enter — 다시 도전</div></div>

<script type="module" src="js/main.js"></script>
</body>
</html>
